name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
  TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=market-research/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -input=false

      - name: Read Terraform outputs
        working-directory: infrastructure
        run: |
          {
            echo "ECR_URL=$(terraform output -raw ecr_repository_url)"
            echo "CLUSTER=$(terraform output -raw ecs_cluster_name)"
            echo "SERVICE=$(terraform output -raw ecs_service_name)"
            echo "BUCKET=$(terraform output -raw frontend_bucket)"
            echo "DIST_ID=$(terraform output -raw cloudfront_distribution_id)"
            echo "CF_URL=$(terraform output -raw site_url)"
          } >> "$GITHUB_ENV"

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          docker build --platform linux/amd64 -f local-dev/Dockerfile.api -t "$ECR_URL:latest" -t "$ECR_URL:${GITHUB_SHA}" .
          docker push --all-tags "$ECR_URL"

      - name: Roll out worker
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and publish frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.CF_URL }}/api
        run: |
          npm ci
          npm run build
          aws s3 sync out/ "s3://$BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" > /dev/null
          echo "Deployed: $CF_URL" >> "$GITHUB_STEP_SUMMARY"
