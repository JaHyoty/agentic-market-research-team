apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-research-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-research-worker
  template:
    metadata:
      labels:
        app: market-research-worker
    spec:
      containers:
      - name: worker
        image: market-research-backend:latest
        command: ["python", "backend/app/worker.py"]
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: SQS_QUEUE_URL
          value: "http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/market-research-tasks"
