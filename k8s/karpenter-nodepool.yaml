apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: agent-nodepool
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"] # Use Spot instances for cost savings
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values: ["t3.medium", "t3.large"]
      nodeClassRef:
        name: default
  limits:
    cpu: 100
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h

---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2 # Amazon Linux 2
  role: "KarpenterNodeRole-market-research-cluster" # Must match IamInstanceProfile created by Terraform
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: market-research-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: market-research-cluster
