apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: worker-deployment
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      metadata:
        # Intentionally using the docker service name "localstack"
        # We will need to ensure K8s pods can resolve this.
        queueURL: "http://localstack:4566/000000000000/market-research-tasks"
        queueLength: "1"
        awsRegion: "us-east-1"
        identityOwner: operator
        awsEndpoint: "http://localstack:4566" # KEDA supports awsEndpoint for custom endpoints
