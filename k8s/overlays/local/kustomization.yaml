apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: Deployment
    name: market-research-worker
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
    - op: replace
      path: /spec/replicas
      value: 0
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: localhost:5000/market-research-backend:local
    - op: replace
      path: /spec/template/spec/containers/0/env/1/value
      value: "http://localstack:4566/000000000000/market-research-tasks"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: AWS_ACCESS_KEY_ID
        value: "test"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: AWS_SECRET_ACCESS_KEY
        value: "test"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: AWS_ENDPOINT_URL
        value: "http://localstack:4566"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: LOCALSTACK_ENDPOINT
        value: "http://localstack:4566"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: DYNAMODB_ENDPOINT
        value: "http://dynamodb-local:8000"

- target:
    kind: ScaledObject
    name: aws-sqs-queue-scaledobject
  patch: |-
    - op: replace
      path: /spec/triggers/0/metadata/queueURL
      value: http://localstack:4566/000000000000/market-research-tasks
