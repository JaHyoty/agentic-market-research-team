services:
  init-perms:
    image: alpine
    command: sh -c "mkdir -p /data/dynamodb_data /data/localstack_data /data/k3s_data /data/kubeconfig && chmod -R 777 /data/dynamodb_data /data/localstack_data /data/k3s_data /data/kubeconfig"
    volumes:
      - .:/data

  localstack:
    depends_on:
      init-perms:
        condition: service_completed_successfully
    image: localstack/localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - PERSISTENCE=1
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "./init-scripts:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    depends_on:
      init-perms:
        condition: service_completed_successfully
    image: amazon/dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    ports:
      - "8000:8000"
    volumes:
      - "./dynamodb_data:/home/dynamodblocal/data"
    working_dir: /home/dynamodblocal

  api-gateway:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/market-research-tasks
      - DYNAMODB_TABLE_TASKS=market-research-tasks
    depends_on:
      localstack:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
    volumes:
      - ../backend:/app/backend
      - ../local-dev:/app/local-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-tables:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.api
    command: python local-dev/create_table.py
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - DYNAMODB_TABLE_TASKS=market-research-tasks
    depends_on:
      dynamodb-local:
        condition: service_started
    volumes:
      - ../local-dev:/app/local-dev

  k3s:
    image: rancher/k3s:v1.27.4-k3s1
    entrypoint: ["/start-k3s.sh"]
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - ./k3s_data:/var/lib/rancher/k3s
      - ./kubeconfig:/output
      - ./scripts/start-k3s.sh:/start-k3s.sh
      - ../k8s:/manifests
      - /sys/fs/cgroup:/sys/fs/cgroup:rw # Fix for cgroup v2
    ports:
      - "6443:6443"
    privileged: true # K3s needs this for container networking
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/k3s-ready"]
      interval: 5s
      timeout: 5s
      retries: 20  # Give it some time to bootstrap and install things

  verify-env:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.api
    command: python local-dev/verify_env.py
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - API_GATEWAY_URL=http://api-gateway:8080
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - KUBECONFIG=/app/local-dev/kubeconfig/kubeconfig-internal.yaml
    depends_on:
      api-gateway:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      create-tables:
        condition: service_completed_successfully
      k3s:
        condition: service_healthy
    volumes:
      - ../local-dev:/app/local-dev