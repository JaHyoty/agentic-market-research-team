services:
  init-perms:
    image: alpine
    command: sh -c "mkdir -p /data/localstack_data && chmod -R 777 /data/localstack_data"
    volumes:
      - .:/data

  localstack:
    depends_on:
      init-perms:
        condition: service_completed_successfully
    image: localstack/localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=sqs,dynamodb,s3,secretsmanager
      - DEBUG=1
      - PERSISTENCE=1
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "./init-scripts:/etc/localstack/init/ready.d"
      - "./.env:/etc/localstack/init/.env"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    ports:
      - "5000:5000"

  api-gateway:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/market-research-tasks
      - DYNAMODB_TABLE_TASKS=market-research-tasks
      - ENV=local
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../local-dev:/app/local-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Worker service (simulates ECS Fargate)
  worker:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.api
    command: python -m backend.app.worker
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/market-research-tasks
      - DYNAMODB_TABLE_TASKS=market-research-tasks
      - S3_BUCKET_REPORTS=market-research-reports
      - ENV=local
    depends_on:
      localstack:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
    deploy:
      replicas: 1  # Set to 0 for true scale-to-zero, 1 for always-on dev
    restart: unless-stopped